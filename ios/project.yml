name: VectorCraft
options:
  deploymentTarget:
    iOS: "18.4"
targets:
  VectorCraft:
    type: application
    platform: iOS
    sources:
      - path: App
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.justinfor.vectorcraft
        TARGETED_DEVICE_FAMILY: "2"
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_OBJC_BRIDGING_HEADER: App/VectorCraft-Bridging-Header.h
        LIBRARY_SEARCH_PATHS: "$(SRCROOT)/rust-lib"
        OTHER_LDFLAGS: "-lvectorcraft_ios $(NATIVE_LIBS)"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: VectorCraft
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UIFileSharingEnabled: true
        NSPhotoLibraryAddUsageDescription: VectorCraft saves the pictures you export to your Photos library.
        LSSupportsOpeningDocumentsInPlace: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleDocumentTypes:
          - CFBundleTypeName: Vector graphics
            CFBundleTypeRole: Editor
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.svg-image
              - com.adobe.pdf
              - com.adobe.encapsulated-postscript
              - public.image
